<script>
/* V3: NeuroScape */
const V3NS = (() => {
  /* Scene data */
  const SOUNDS = {
    ambient: ['Forest Wind Bed','Rain Ambience','Low Forest Hum','Morning Mist'],
    event:   ['Distant Bird Call','Leaves Rustling','Wind Gust','Branch Creak'],
    action:  ['Grass Footsteps','Soft Breathing','Fabric Rustle'],
  };
  const ACTIVE = [
    {ambient:[0],    event:[],       action:[0]   },
    {ambient:[0,2],  event:[0,2],    action:[0]   },
    {ambient:[0,1,2],event:[0,1,2,3],action:[0,1] },
    {ambient:[0,2],  event:[0,1],    action:[0,1] },
  ];
  const PHASES    = ['settling','immersion','adaptive_shift','integration'];
  const DENSITIES = ['low','low','medium','low'];
  let eegStepSec = Number('{{ eeg_step_sec or 10 }}') || 10;
  const GUIDANCE  = [
    'Now, imagine yourself in a rainforest.',
    'Notice your breath while soft forest air surrounds you.',
    'Let the gentle sounds guide you deeper into stillness.',
    'Feel the ground beneath you. You are safe here.',
  ];
  const RECS = [
    'The spatial experience will be updated after the first 30 seconds, based on your measured mental states.',
    'if anxiety ->\n  reduce event density\n  increase low-frequency ambient\n\nif attention ->\n  add spatial movement\n  introduce directional cues',
    'Anxiety decreasing. Stability improving.\n  maintain gentle event layer\n  allow richer spatial movement',
    'System entering closing phase.\n  reduce density\n  fade event sounds\n  keep ambient soft',
  ];
  const FALLBACK_BY_CAT = {
    ambient: SOUNDS.ambient,
    event: SOUNDS.event,
    action: SOUNDS.action,
  };
  const SCENE_VISUALS = {
    forest: {
      img:'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=2400&q=90',
      accent:'154,139,238', orbA:'190,255,205', orbB:'120,224,255',
    },
    ocean: {
      img:'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=2400&q=90',
      accent:'76,170,255', orbA:'130,235,255', orbB:'80,150,255',
    },
    beach: {
      img:'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=2400&q=90',
      accent:'80,190,230', orbA:'150,245,255', orbB:'255,220,140',
    },
    rain: {
      img:'https://images.unsplash.com/photo-1519692933481-e162a57d6721?auto=format&fit=crop&w=2400&q=90',
      accent:'125,150,255', orbA:'170,210,255', orbB:'130,170,255',
    },
    mountain: {
      img:'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=2400&q=90',
      accent:'150,190,230', orbA:'210,240,255', orbB:'130,180,235',
    },
    snow: {
      img:'https://images.unsplash.com/photo-1483664852095-d6cc6870702d?auto=format&fit=crop&w=2400&q=90',
      accent:'170,210,255', orbA:'235,250,255', orbB:'160,210,255',
    },
    city: {
      img:'https://images.unsplash.com/photo-1449824913935-59a10b8d2000?auto=format&fit=crop&w=2400&q=90',
      accent:'255,165,110', orbA:'255,190,120', orbB:'180,150,255',
    },
    desert: {
      img:'https://images.unsplash.com/photo-1509316975850-ff9c5deb0cd9?auto=format&fit=crop&w=2400&q=90',
      accent:'255,185,110', orbA:'255,225,150', orbB:'255,150,100',
    },
    default: {
      img:'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=2400&q=90',
      accent:'154,139,238', orbA:'190,255,205', orbB:'120,224,255',
    },
  };

  /* Spatial sources */
  const SRCS = [
    {color:'rgba(130,200,130,.85)', angle:45,  dist:.72, vA:.008, vD:-.001, on:false},
    {color:'rgba(100,180,210,.85)', angle:200, dist:.52, vA:-.006,vD:.002,  on:false},
    {color:'rgba(210,180,100,.75)', angle:315, dist:.85, vA:.004, vD:-.003, on:false},
  ];
  const REAL_COLORS = [
    'rgba(130,200,130,.88)',
    'rgba(100,180,210,.88)',
    'rgba(210,180,100,.84)',
    'rgba(190,145,230,.84)',
    'rgba(240,150,130,.82)',
  ];
  const v3Trails = {};
  const v3MotionSeed = {};

  /* State */
  let sec=0, phaseIdx=0, playing=false;
  let timerInt=null, mapRAF=null, waveRAF=null;
  let stepInFlight=false;
  let pendingEEGSteps=0;
  let eegSampleInFlight=false;
  let endingSession=false;
  let lastEEGStep=0;
  let eegMode='{{ eeg_mode or "realtime" }}';
  let userPrompt='';
  let hasRealEEG=false;
  let v3Bands={alpha:0,beta:0,theta:0,delta:0,gamma:0};
  let v3TargetBands={alpha:0,beta:0,theta:0,delta:0,gamma:0};
  let v3Scores={relaxation:0,attention:0,stability:0};
  let v3TargetScores={relaxation:0,attention:0,stability:0};
  let v3BandHistory=[];
  let eegPlaybackSamples=[];
  let eegSamplesLoading=false;
  let sessionStartMs=0;
  let lastRealtimeSamplePoll=0;
  let lastPlaybackHistoryAt=-1;
  let meditationDurationSec=600;
  let eegTimerStarted=false;
  let eegStartedNoticeSent=false;
  let latestMental=null;
  let latestPreviousMental=null;
  let latestRecItem=null;
  let latestWindowMental=null;
  let scenePollInFlight=false;

  /* Navigation */
  function goTo(page) {
    if (mapRAF)  { cancelAnimationFrame(mapRAF);  mapRAF=null;  }
    if (waveRAF) { cancelAnimationFrame(waveRAF); waveRAF=null; }
    document.querySelectorAll('.v3-page').forEach(el=>el.classList.remove('v3-active'));
    const el = document.getElementById('v3-'+page);
    if (el) el.classList.add('v3-active');
    if (page==='session') initSession();
  }
  function setMode(mode) {
    eegMode = mode === 'realtime' ? 'realtime' : 'recorded';
    document.querySelectorAll('[data-v3-mode]').forEach(btn=>{
      btn.classList.toggle('on', btn.dataset.v3Mode === eegMode);
    });
  }

  /* Home submit */
  async function submit() {
    const inp = document.getElementById('v3-prompt');
    const durationInput = document.getElementById('v3-duration-minutes');
    userPrompt = inp&&inp.value.trim() ? inp.value.trim() : 'I want a forest scene to get relaxed...';
    const requestedMinutes=Number(durationInput?.value);
    const durationMinutes=Number.isFinite(requestedMinutes)
      ? Math.max(1,Math.min(180,requestedMinutes))
      : 10;
    if (durationInput) durationInput.value=String(Math.round(durationMinutes));
    meditationDurationSec=Math.round(durationMinutes*60);
    goTo('loading');
    let ok = false;
    try {
      const r = await fetch('/api/bootstrap', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({prompt:userPrompt, eeg_mode:eegMode, duration_minutes:durationMinutes})
      });
      const d = await r.json();
      if (r.ok) {
        applyState(d);
        V2.payload = null;
        V2.history = [];
        V2.idx = -1;
        V2.total = Number(d.total_windows) || 0;
        eegStepSec = Number(d.eeg_step_sec) || eegStepSec;
        meditationDurationSec = Number(d.meditation_duration_sec) || meditationDurationSec;
        hasRealEEG = false;
        v3Bands = {alpha:0,beta:0,theta:0,delta:0,gamma:0};
        v3TargetBands = {alpha:0,beta:0,theta:0,delta:0,gamma:0};
        v3Scores = {relaxation:0,attention:0,stability:0};
        v3TargetScores = {relaxation:0,attention:0,stability:0};
        v3BandHistory = [];
        eegPlaybackSamples = [];
        latestMental = null;
        latestPreviousMental = null;
        latestRecItem = null;
        latestWindowMental = null;
        phaseIdx = 0;
        refreshScene();
        ok = true;
      } else {
        throw new Error(d.error || `Bootstrap failed with ${r.status}`);
      }
    } catch(e) {
      console.error('V3 bootstrap failed', e);
      alert(`Scene generation failed: ${e.message || e}`);
      goTo('home');
      return;
    }
    setTimeout(()=>{
      refreshScene();
      if (ok) goTo('session');
    }, 650);
  }

  /* Session init */
  function initSession() {
    sec=0; phaseIdx=0; playing=true;
    lastEEGStep=0;
    endingSession=false;
    sessionStartMs=0;
    eegTimerStarted=false;
    eegStartedNoticeSent=false;
    lastPlaybackHistoryAt=-1;
    latestRecItem = V2.idx >= 0 && Array.isArray(V2.history) && V2.history.length ? V2.history[V2.history.length-1] : null;
    latestWindowMental = latestRecItem;
    clearInterval(timerInt);
    renderTimer();
    refreshScene();
    if (!V2.payload) hasRealEEG=false;
    renderEEGWaiting();
    loadEEGPlaybackSamples();
    if (eegMode === 'realtime') refreshEEGSample();
    renderGuidance(0); renderRec(0);
    if (latestWindowMental) renderMentalFromWindowOutput(latestWindowMental);
    updateSrcs(0);
    startTimer(); scheduleMap(); scheduleWave();
    animateV3UI();
    processEEGStep();
  }
  function animateV3UI() {
    if (!window.anime) return;
    anime.remove('#v3-session .v3-panel, #v3-session .v3-center-card, #v3-session .v3-footer');
    anime({
      targets:'#v3-session .v3-panel, #v3-session .v3-center-card, #v3-session .v3-footer',
      opacity:[0,1],
      translateY:[14,0],
      delay:anime.stagger(55),
      duration:760,
      easing:'easeOutCubic',
    });
  }

  /* Timer */
  function renderTimer() {
    const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60;
    const el=document.getElementById('v3-timer');
    if (el) el.textContent=`${p2(h)}:${p2(m)}:${p2(s)}`;
    const meta=document.getElementById('v3-timer-meta');
    if (!meta) return;
    const targetMinutes=Math.round(meditationDurationSec/60);
    if (!eegTimerStarted) {
      meta.textContent=`Waiting for EEG · ${targetMinutes} min target`;
      return;
    }
    const remaining=Math.max(0,meditationDurationSec-sec);
    meta.textContent=`EEG meditation time · ${formatClock(remaining)} remaining`;
  }
  function formatClock(totalSec) {
    const total=Math.max(0,Math.round(totalSec));
    const h=Math.floor(total/3600), m=Math.floor((total%3600)/60), s=total%60;
    return h ? `${h}:${p2(m)}:${p2(s)}` : `${p2(m)}:${p2(s)}`;
  }
  function markEEGReceived() {
    if (eegTimerStarted || endingSession) return;
    eegTimerStarted=true;
    sessionStartMs=performance.now();
    sec=0;
    renderTimer();
    if (!eegStartedNoticeSent) {
      eegStartedNoticeSent=true;
      fetch('/api/eeg_started', {method:'POST'}).catch(e=>{
        console.warn('Could not record EEG timer start', e);
      });
    }
  }
  function startTimer() {
    timerInt = setInterval(()=>{
      if (!playing) return;
      if (eegTimerStarted && sessionStartMs) {
        sec=Math.max(0,Math.floor((performance.now()-sessionStartMs)/1000));
      }
      renderTimer();
      if (eegMode === 'realtime') refreshEEGSample();
      if (!eegTimerStarted) return;
      if (sec >= meditationDurationSec) {
        finishSessionAndRedirect('duration_complete');
        return;
      }
      const eegStep=Math.floor(sec/eegStepSec);
      const ni=syncPhaseFromSession();
      if (ni!==phaseIdx) {
        phaseIdx=ni;
        refreshScene();
        renderGuidance(ni); renderRec(ni);
        updateSrcs(ni);
      }
      if (eegStep!==lastEEGStep) {
        lastEEGStep=eegStep;
        processEEGStep();
      }
    },1000);
  }
  function p2(n){return String(n).padStart(2,'0');}
  function dataDrivenPhaseIdx() {
    if (eegMode !== 'recorded' || !V2.total || V2.idx < 0) return phaseIdx;
    const progress = Math.max(0, Math.min(1, (V2.idx + 1) / V2.total));
    if (progress >= .9) return 3;
    if (progress >= .6) return 2;
    if (progress >= .3) return 1;
    return 0;
  }
  function syncPhaseFromSession() {
    const eegStep=Math.floor(sec/eegStepSec);
    return eegMode === 'recorded' ? dataDrivenPhaseIdx() : Math.min(3,eegStep);
  }

  async function togglePlay() {
    await finishSessionAndRedirect('manual');
  }

  async function finishSessionAndRedirect(endReason='manual') {
    if (endingSession) return;
    endingSession=true;
    playing=false;
    clearInterval(timerInt);
    const btn=document.getElementById('v3-pp');
    if (btn) btn.textContent='...';
    try {
      await fetch('/api/end_session', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          elapsed_sec:sec,
          end_reason:endReason,
          meditation_duration_sec:meditationDurationSec
        })
      });
    } catch(e) {
      console.warn('V3 end session failed before summary redirect', e);
    } finally {
      window.location.assign('/summary');
    }
  }

  async function processEEGStep() {
    if (endingSession) return;
    if (stepInFlight) {
      pendingEEGSteps++;
      return;
    }
    stepInFlight=true;
    try {
      const r=await fetch('/api/step', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({direction:'next', elapsed_sec:sec})
      });
      const d=await r.json();
      if (r.ok) {
        if (d.done && eegMode === 'recorded') {
          await finishSessionAndRedirect();
          return;
        }
        if (d.error && !d.current_payload) {
          sEl('v3-rec', eegMode === 'realtime'
            ? 'Waiting for realtime Muse EEG window...\nKeep Muse OSC streaming; the scene will update when a live window arrives.'
            : d.error);
          return;
        }
        applyState(d);
        phaseIdx=syncPhaseFromSession();
        if (eegMode === 'realtime') renderFromPayload(d.current_payload);
        const latest=(d.mental_history||[]).slice(-1)[0];
        if (latest) {
          latestWindowMental=latest;
          latestRecItem=latest;
          renderRecFromMental(latest);
          renderMentalFromWindowOutput(latest);
        }
        refreshScene();
        pollSceneAdaptation(d.adaptation_pending);
      }
    } catch(e) {
      console.warn('V3 EEG step failed', e);
    } finally {
      stepInFlight=false;
      if (pendingEEGSteps > 0 && playing && !endingSession) {
        pendingEEGSteps--;
        setTimeout(processEEGStep, 0);
      }
    }
  }

  async function refreshEEGSample() {
    if (eegSampleInFlight || endingSession) return;
    const now=performance.now();
    if (now-lastRealtimeSamplePoll < 250) return;
    lastRealtimeSamplePoll=now;
    eegSampleInFlight=true;
    try {
      const r=await fetch(`/api/eeg_sample?elapsed_sec=${encodeURIComponent(sec)}`, {cache:'no-store'});
      if (!r.ok) return;
      const sample=await r.json();
      renderFromPayload(sample);
    } catch(e) {
      console.warn('V3 EEG sample refresh failed', e);
    } finally {
      eegSampleInFlight=false;
    }
  }

  async function loadEEGPlaybackSamples() {
    if (eegMode !== 'recorded' || eegSamplesLoading || eegPlaybackSamples.length) return;
    eegSamplesLoading=true;
    try {
      const r=await fetch('/api/eeg_samples', {cache:'no-store'});
      if (!r.ok) return;
      const d=await r.json();
      eegPlaybackSamples=Array.isArray(d.samples) ? d.samples : [];
      if (eegPlaybackSamples.length) renderFromPayload(eegPlaybackSamples[0], {recordHistory:false, immediate:true});
    } catch(e) {
      console.warn('V3 EEG playback preload failed', e);
    } finally {
      eegSamplesLoading=false;
    }
  }

  /* Scene JSON */
  function sceneType() {
    return V2.scene?.scene_type || V2.scene?.world_state?.scene_family || 'scene';
  }
  function sceneVisual(sceneName) {
    const key=String(sceneName||'').toLowerCase();
    return Object.entries(SCENE_VISUALS).find(([k])=>key.includes(k))?.[1] || SCENE_VISUALS.default;
  }
  function applySceneVisual() {
    const root=document.getElementById('v3');
    if (!root) return;
    const v=sceneVisual(sceneType());
    root.style.setProperty('--v3-scene-img',`url('${v.img}')`);
    root.style.setProperty('--v3-accent',v.accent);
    root.style.setProperty('--v3-orb-a',v.orbA);
    root.style.setProperty('--v3-orb-b',v.orbB);
  }
  function cleanName(value) {
    const raw=String(value||'').replace(/\\/g,'/').split('/').pop() || 'sound';
    return raw.replace(/\.(wav|mp3|ogg|flac|aiff|aif)$/i,'');
  }
  function displayName(source) {
    return cleanName(source?.clip || source?.asset_ref || source?.source_id || source?.id || source);
  }
  function escHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, ch => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[ch]));
  }
  function sceneSourceList() {
    const active=new Set(V2.scene?.world_state?.active_sources || []);
    const byId={};
    (V2.scene?.sources || []).forEach(s=>{
      const id=s.source_id || s.id || s.asset_ref;
      if (id) byId[id]=s;
    });
    return renderableSources(V2.scene,V2.unityRuntime,V2.unityCommands).map(src=>{
      const base=byId[src.id] || {};
      return {
        ...base,
        ...src,
        source_id: src.id || base.source_id,
        category: base.category || (src.motion?.type && src.motion.type !== 'none' ? 'event' : 'ambient'),
        asset_ref: base.asset_ref || src.clip || src.id,
        active: src.isActive || active.has(src.id),
      };
    });
  }
  function groupedSceneSources() {
    const groups={ambient:[],event:[],action:[]};
    sceneSourceList().forEach(s=>{
      const cat=(s.category||'ambient').toLowerCase();
      const key=cat.includes('action')||cat.includes('narration')?'action':cat.includes('event')?'event':'ambient';
      groups[key].push(s);
    });
    return groups;
  }
  function sceneAtmosphere() {
    const st=sceneType();
    const mental=latestWindowMental?.mental_state || latestWindowMental || V2.scene?.mental_state || {};
    if (mental && Object.keys(mental).length) return mentalAtmosphere(mental);
    return V2.scene?.world_state?.atmosphere || V2.scene?.atmosphere || `A ${st} soundscape is ready.`;
  }
  function sceneNarration() {
    const mental=latestWindowMental?.mental_state || latestWindowMental || V2.scene?.mental_state || {};
    if (mental && Object.keys(mental).length) return mentalNarration(mental);
    return V2.scene?.narration_script || 'Your adaptive soundscape will respond to the EEG session.';
  }
  function metric01(mental, key) {
    const display=mental.display_scores || mental.mental_state?.display_scores;
    const raw=display?.[key] ?? mental[key] ?? mental.mental_state?.[key];
    const n=Number(raw);
    if (!Number.isFinite(n)) return null;
    return Math.max(0,Math.min(1,n > 1 ? n/100 : n));
  }
  function mentalVariant(mental) {
    const raw=mental?.window_id ?? mental?.step ?? mental?.session_elapsed_sec ?? V2.idx ?? 0;
    const n=Number(raw);
    return Number.isFinite(n) ? Math.max(0,Math.floor(n)) : 0;
  }
  function pickVariant(options, variant) {
    return options[Math.max(0,variant) % options.length];
  }
  function mentalNarration(mental) {
    const state=String(mental.llm_state || mental.state_label || mental.rule_state || '').toLowerCase();
    const attention=metric01(mental,'attention');
    const relaxation=metric01(mental,'relaxation');
    const stability=metric01(mental,'stability');
    const variant=mentalVariant(mental);
    const place=sceneType().includes('ocean') || sceneType().includes('beach') ? 'shoreline' : 'forest';
    if (relaxation != null && relaxation < .45) {
      return pickVariant([
        `Let the ${place} soften around you; follow the gentlest layer back toward ease.`,
        'Let the closest sound become your anchor, then loosen your shoulders with the next breath.',
        'Stay with the softest texture in the scene and let the rest of the space slow down.',
        'Allow the soundscape to hold the edges of your attention while your body settles.',
      ], variant);
    }
    if ((attention != null && attention < .45) || state.includes('distract')) {
      return pickVariant([
        'Notice the small directional cues, then return your attention to the space around you.',
        'Follow one moving cue across the scene, then come back to the center of your breath.',
        'Let the next distant sound gently point your attention outward and back again.',
      ], variant);
    }
    if (stability != null && stability < .65) {
      return pickVariant([
        'Stay with the steady background sound as the scene settles into a more balanced rhythm.',
        'Let the stable layer underneath the scene set the pace for the next few breaths.',
        'Keep your attention on the slow bed of sound while the moving details become quieter.',
      ], variant);
    }
    if (state.includes('focus')) {
      return 'Keep your focus lightly open while the soundscape stays spacious and steady.';
    }
    const implication=mental.scene_implication;
    if (typeof implication === 'string' && implication.trim()) return implication.trim();
    if (implication && typeof implication === 'object') {
      const text=implication.summary || implication.description || implication.note || implication.recommendation;
      if (text) return String(text).trim();
    }
    return V2.scene?.narration_script || `Let this segment continue gently, with your breath and the ${place} moving together.`;
  }
  function mentalAtmosphere(mental) {
    const state=String(mental.llm_state || mental.state_label || mental.rule_state || '').toLowerCase();
    const attention=metric01(mental,'attention');
    const relaxation=metric01(mental,'relaxation');
    const stability=metric01(mental,'stability');
    const variant=mentalVariant(mental);
    const isOcean=sceneType().includes('ocean') || sceneType().includes('beach');
    if (relaxation != null && relaxation < .45) {
      return pickVariant(isOcean ? [
        'close shoreline air with softened waves and steady grounding texture',
        'low tide ambience with rounded surf and near-body calm',
        'muted coastal air with slow foam movement and gentle grounding',
      ] : [
        'soft enclosed forest air with gentle grounding movement',
        'warm forest hush with low rustling textures close to the body',
        'quiet green air with softened leaf motion and slower breath-like pacing',
        'sheltered woodland space with gentle near-field movement',
      ], variant);
    }
    if ((attention != null && attention < .45) || state.includes('distract')) {
      return pickVariant(isOcean ? [
        'wide coastal air with clear distant cues and gentle side movement',
        'open shoreline space with small directional calls over steady waves',
        "bright sea air with sparse cues crossing the listener's edge",
      ] : [
        'clear forest space with small directional cues and light motion',
        'open woodland air with tiny far cues drawing attention outward',
        'leaf-filtered space with subtle side movement and crisp distant detail',
      ], variant);
    }
    if (stability != null && stability < .65) {
      return pickVariant(isOcean ? [
        'balanced seaside air with slow wave rhythm and reduced motion',
        'settled coastal texture with even surf and softened motion',
      ] : [
        'steady forest air with slower texture and balanced movement',
        'grounded forest ambience with reduced motion and even spacing',
        'calm woodland texture with stable layers and softened transitions',
      ], variant);
    }
    return isOcean ? 'open seaside air with spacious waves and calm forward focus' : 'open forest calm with spacious attention and stable organic motion';
  }
  async function pollSceneAdaptation(pending, tries=0) {
    if (!pending || scenePollInFlight || endingSession) return;
    scenePollInFlight=true;
    try {
      await new Promise(resolve => setTimeout(resolve, tries ? 420 : 180));

  function idSeed(id) {

      ctx.fill();

      ctx.beginPath();
      ctx.arc(p.x,p.y,Math.max(1.8,rr*.16),0,Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,.28)';
      ctx.fill();
      ctx.restore();
    });
    Object.keys(v3Trails).forEach(id=>{ if(!seen.has(id)) delete v3Trails[id]; });
  }

  /* Spatial map (canvas RAF loop) */
  function scheduleMap() {
    const cv=document.getElementById('v3-map'); if(!cv) return;
    const parent=cv.parentElement;
    const raw=Math.min(parent.clientWidth-42, parent.clientHeight-96, 560);
    const sz=Math.max(280,raw);
    const dpr=Math.min(2.5,window.devicePixelRatio||1);
    cv.style.width=`${sz}px`;
    cv.style.height=`${sz}px`;
    cv.width=Math.round(sz*dpr);
    cv.height=Math.round(sz*dpr);
    cv.dataset.mapSize=String(sz);
    cv.dataset.mapDpr=String(dpr);
    drawMap();
  }
  function drawMap() {
    const cv=document.getElementById('v3-map'); if(!cv) return;
    const ctx=cv.getContext('2d');
    const sz=Number(cv.dataset.mapSize)||cv.clientWidth||cv.width;
    const dpr=Number(cv.dataset.mapDpr)||1;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const cx=sz/2, cy=sz/2;
    const rO=sz*.475, rM=sz*.325, rI=sz*.185;
    ctx.clearRect(0,0,sz,sz);

    /* rings */
    const ringLabels=[
      {r:rO,lbl:'FAR',sub:'6m+',y:sz-sz*.072},
      {r:rM,lbl:'MIDDLE',sub:'[3m,6m]',y:Math.min(cy+rM+sz*.038, sz-sz*.17)},
      {r:rI,lbl:'NEAR',sub:'[0,3m]',y:Math.min(cy+rI+sz*.038, cy+rM-sz*.022)},
    ];
    ringLabels.forEach(({r,lbl,sub,y})=>{
      ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
      ctx.strokeStyle='rgba(255,255,255,.135)';
      ctx.lineWidth=.72;
      ctx.shadowColor='rgba(255,255,255,.055)';
      ctx.shadowBlur=8;
      ctx.stroke();
      ctx.shadowBlur=0;
      ctx.fillStyle='rgba(255,255,255,.34)';
      ctx.textAlign='center';
      ctx.font=`500 ${Math.max(9,sz*.022)}px Inter, Arial`;
      ctx.fillText(lbl,cx,y);
      ctx.fillStyle='rgba(255,255,255,.24)';
      ctx.font=`300 ${Math.max(7,sz*.017)}px Inter, Arial`;
      ctx.fillText(sub,cx,y+sz*.023);
    });

    const liveSources=currentUnitySources();
    if (liveSources.length) {
      drawLiveSources(ctx,liveSources,cx,cy,rO,sz);
    } else {
      /* sound sources */
      SRCS.forEach(src=>{
        if (!src.on) return;
        const rad=src.angle*Math.PI/180;
        const r=src.dist*rO;
        const sx=cx+Math.cos(rad)*r, sy=cy-Math.sin(rad)*r;
        const rr=12;
        const g=ctx.createRadialGradient(sx,sy,0,sx,sy,42);
        g.addColorStop(0,src.color);
        g.addColorStop(.42,'rgba(255,255,255,.1)');
        g.addColorStop(1,'transparent');
        ctx.beginPath(); ctx.arc(sx,sy,42,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
        ctx.save();
        ctx.shadowColor=src.color; ctx.shadowBlur=16;
        const orb=ctx.createRadialGradient(sx-5,sy-6,1,sx,sy,rr);
        orb.addColorStop(0,'rgba(255,255,255,.72)');
        orb.addColorStop(.35,src.color);
        orb.addColorStop(1,'rgba(110,190,230,.72)');
        ctx.beginPath(); ctx.arc(sx,sy,rr,0,Math.PI*2); ctx.fillStyle=orb; ctx.fill();
        ctx.strokeStyle='rgba(255,255,255,.4)'; ctx.lineWidth=.9; ctx.stroke();
        ctx.restore();
      });
    }

    /* YOU dot */
    ctx.save();
    ctx.shadowColor='rgba(255,255,255,.22)';
    ctx.shadowBlur=8;
    ctx.beginPath(); ctx.arc(cx,cy,5.2,0,Math.PI*2); ctx.fillStyle='rgba(255,255,255,.52)'; ctx.fill();
    ctx.restore();
    ctx.fillStyle='rgba(255,255,255,.46)'; ctx.textAlign='center';
    ctx.font=`400 ${Math.max(9,sz*.022)}px Inter, Arial`; ctx.fillText('YOU',cx,cy+sz*.055);

    if (!liveSources.length) {
      /* animate sources */
      SRCS.forEach(s=>{
        s.angle+=s.vA; s.dist+=s.vD;
        if (s.dist>.94||s.dist<.15) s.vD*=-1;
      });
    }
    mapRAF=requestAnimationFrame(drawMap);
  }

  /* EEG waveform (canvas RAF loop) */
  function scheduleWave() { tickWave(); }
  function prepCanvas(canvas) {
    const rect=canvas.getBoundingClientRect();
    const dpr=Math.min(2.5,window.devicePixelRatio||1);
    const w=Math.max(1,Math.round(rect.width*dpr));
    const h=Math.max(1,Math.round(rect.height*dpr));
    if (canvas.width!==w || canvas.height!==h) {
      canvas.width=w;
      canvas.height=h;
      canvas.dataset.dpr=String(dpr);
    }
    return {w:rect.width,h:rect.height,dpr};
  }
  function tickWave() {
    const cv=document.getElementById('v3-wave'); if(!cv) { waveRAF=requestAnimationFrame(tickWave); return; }
    const ctx=cv.getContext('2d');
    const dims=prepCanvas(cv);
    const W=dims.w,H=dims.h,mid=H/2,sc=H*.38;
    ctx.setTransform(dims.dpr,0,0,dims.dpr,0,0);
    ctx.clearRect(0,0,W,H);
    updateEEGPlaybackFrame();
    updateBandBars();
    if (!hasRealEEG) {
      ctx.fillStyle='rgba(255,255,255,.34)';
      ctx.textAlign='center';
      ctx.font='400 11px Inter, Arial';
      ctx.fillText(eegMode === 'realtime' ? 'Waiting for Muse EEG window' : 'Loading CSV EEG window', W/2, mid+4);
      waveRAF=requestAnimationFrame(tickWave);
      return;
    }
    const series = v3BandHistory.length ? v3BandHistory : [{scores:v3Scores}];
    const waveValue = (item, key) => {
      const scores = item.scores || {};
      return normBand(scores[key]);
    };
    [
      ['relaxation',SCORE_COLORS.relaxation],
      ['attention',SCORE_COLORS.attention],
      ['stability',SCORE_COLORS.stability]
    ].forEach(([key,col])=>{
      ctx.strokeStyle=col; ctx.lineWidth=2.2; ctx.beginPath();
      series.forEach((item,i)=>{
        const v=waveValue(item,key);
        const x=series.length===1 ? W : (i/(series.length-1))*W;
        const y=H-6-v*(H-12);
        if (i===0) ctx.moveTo(0,y);
        if (series.length===1) ctx.lineTo(W,y);
        else ctx.lineTo(x,y);
      });
      ctx.stroke();
    });
    waveRAF=requestAnimationFrame(tickWave);
  }

  /* Enter key on home input */
document.addEventListener('DOMContentLoaded',()=>{
    const inp=document.getElementById('v3-prompt');
    if (inp) inp.addEventListener('keydown',e=>{ if(e.key==='Enter') submit(); });
    if (window.lucide) window.lucide.createIcons();
  });

  document.addEventListener('DOMContentLoaded',()=>setMode(eegMode));
  window.addEventListener('resize',()=>{ if (document.getElementById('v3-session')?.classList.contains('v3-active')) scheduleMap(); });

  return {goTo, submit, togglePlay, refreshScene, setMode};
})();

function v3Submit()    { V3NS.submit(); }
function v3GoTo(p)     { V3NS.goTo(p); }
function v3TogglePlay(){ V3NS.togglePlay(); }
function v3SetMode(m)  { V3NS.setMode(m); }
</script>
